<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
  <!-- Modern Monogram "S" -->
  <text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">S</text>
  <!-- Emerald Status Dot -->
  <circle cx="48" cy="18" r="4" fill="#10b981" filter="url(#glow)"/>
  <circle cx="48" cy="18" r="2" fill="#ffffff" opacity="0.8"/>
</svg>
